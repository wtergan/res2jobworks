[project]
name = "res2jobworks"
version = "0.1.0"
description = "Public-generic, local-first job-search workbench foundation."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["packages/core/src/res2jobworks_core"]

[tool.hatch.build.targets.wheel.force-include]
"commands/registry.yaml" = "packages/core/src/res2jobworks_core/registry.yaml"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["packages/core/src"]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["packages/core/src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
